# The repository's only workflow. It re-runs, on the server, the deterministic checks that until now
# existed only as conventions in prose.
#
# Three properties are deliberate and must survive every edit:
#
#  1. ONE JOB, SHELL PREDICATES. There is no build, no manifest and no lockfile in this repository and
#     this workflow must not introduce one. `python3` appears only to run `tools/bla-check` and its
#     self-test (Python 3 is preinstalled on ubuntu-latest); `npx` appears only to run markdownlint at
#     a pinned version. Everything else is POSIX shell, `grep`, `awk` and `find`.
#  2. ONE FAILURE FORMAT. Every predicate that fails prints exactly `FALHA [rule-name] <message>` and
#     the step exits 1. The rule name is the contract: it is what a reader greps for and what the
#     wave's verification block asserts, so rename a rule only together with every reference to it.
#     `tools/bla-check` prints the same shape for its own rules.
#  3. PORTABLE PREDICATES. Every predicate must run unchanged on this runner's GNU userland AND on a
#     maintainer's macOS BSD userland: no `grep -P`, no `sed -i` without an argument, no `readlink -f`,
#     and never `grep -l` with `-c` added to it (BSD prints both a `file:count` line and a bare `file`
#     line per match, which silently doubles every count — count lines with `-c` alone, or list files
#     with `-l` alone and pipe to `wc -l`). Sums are computed with `awk`, not `paste | bc`, for the same
#     reason.
#     Each predicate is written to be safe under `set -e` and `pipefail`, so it can be copied out of
#     this file and pasted into a local shell verbatim — that is how it is verified before it lands.
#
# Every check here was born green: the corrections it protects landed in the same commit as the check.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        # fetch-depth: 0 — the secret scan needs the full history, not just the tip commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: doc-truth
        # The README states counts about the repository. A count that drifts from disk is a lie the
        # reader has no way to detect, so every count is derived from disk and compared. The step then
        # widens to the same defect in other shapes: the memory-rule cap against the document that
        # declares it, the artifact catalog's Template column in both directions, the closed flow-event
        # set against its second copy in tools/bla-check, and the absence of a fabricated metric series.
        run: |
          f=0

          real=$(find skills -name SKILL.md | wc -l | tr -d ' ')

          grep -q "skills-$real-blue" README.md \
            || { echo "FALHA [badge-count] README.md the skills badge does not read skills-$real-blue"; f=1; }

          sum=$(grep -oE '\(([0-9]+) skills?\)' README.md \
                | grep -oE '[0-9]+' \
                | awk '{s+=$1} END {print s+0}' || true)
          [ "$sum" = "$real" ] \
            || { echo "FALHA [subtotal-sum] README.md the (N skills) subtotals sum to $sum, expected $real"; f=1; }

          for d in skills/*/; do
            grep -q "$d" README.md || { echo "FALHA [skill-missing-from-readme] $d is not named in README.md"; f=1; }
          done

          dirs=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          [ "$dirs" = "$real" ] \
            || { echo "FALHA [skill-dir-exact-set] skills/ has $dirs directories but $real SKILL.md files"; f=1; }

          # The third count README states about disk. docs/references.md numbers its rows 1..N in the
          # first column of every section table, so N is derivable; the "## How These Map to Skills"
          # table cites #IDs and holds no numbered row, which is why the pattern anchors on `| <n> |`.
          # README said 49 while disk held 48 until this arm was added — the same defect class as
          # badge-count, in the one count that had no reader.
          refs=$(grep -oE '^\| *[0-9]+ *\|' docs/references.md | grep -oE '[0-9]+' | sort -n | tail -1)
          [ -n "$refs" ] \
            || { echo "FALHA [reference-count-unparsed] docs/references.md no longer numbers its rows; this predicate can no longer read the count it compares"; f=1; refs=0; }
          grep -q "list of $refs references" README.md \
            || { echo "FALHA [reference-count] README.md does not say 'list of $refs references', which is what docs/references.md numbers"; f=1; }

          # A section heading glued to the paragraph above it is not a style nit: CommonMark does not
          # open an ATX heading there in every renderer, so the section silently stops being a section.
          glued=$(awk '/^## /{ if (prev != "") printf " %d", NR } {prev=$0}' README.md)
          [ -z "$glued" ] \
            || { echo "FALHA [heading-needs-blank-line] README.md needs a blank line before the heading on line(s):$glued"; f=1; }

          # Real memory rules are `### IM-<digit>`; `### IM-XXX` is the placeholder inside the Rule
          # Shape fenced block. The loose `^### IM-` counts the placeholder as a rule, so the cap is
          # checked against the tight pattern and the cap itself is read from the document that
          # declares it instead of being hardcoded here.
          im_real=$(grep -c '^### IM-[0-9]' .bla/implementation-memory.md | tr -d ' ' || true)
          im_all=$(grep -c '^### IM-' .bla/implementation-memory.md | tr -d ' ' || true)
          im_cap=$(grep -oE 'Maximum ([0-9]+) active rules' skills/implementation-memory/SKILL.md \
                   | grep -oE '[0-9]+' | head -1 || true)
          [ -n "$im_cap" ] \
            || { echo "FALHA [memory-cap-undeclared] skills/implementation-memory/SKILL.md no longer declares 'Maximum N active rules'"; f=1; im_cap=12; }
          [ "$im_real" -le "$im_cap" ] \
            || { echo "FALHA [memory-cap-exceeded] .bla/implementation-memory.md has $im_real active rules, cap is $im_cap"; f=1; }
          [ "$im_all" = "$((im_real + 1))" ] \
            || { echo "FALHA [memory-shape-placeholder] .bla/implementation-memory.md has $im_all '### IM-' headings for $im_real rules; the Rule Shape placeholder must be present exactly once and must not be numbered"; f=1; }

          # docs/artifact-catalog.md is the index authors are sent to for the shape of every artifact,
          # so its Template column is checked in BOTH directions. A cited template that does not exist
          # sends the author to nothing; a template on disk that the catalog never names is an orphan,
          # which is the defect the catalog was written to end (three templates were orphans before it).
          for t in $(grep -ohE 'skills/[a-z0-9-]+/templates/[a-z0-9-]+\.md' docs/artifact-catalog.md \
                     | sort -u); do
            [ -e "$t" ] \
              || { echo "FALHA [catalog-template-exists] docs/artifact-catalog.md cites $t, which does not exist on disk"; f=1; }
          done

          for t in $(find skills -path '*/templates/*.md' | sort); do
            grep -q "$(basename "$t")" docs/artifact-catalog.md \
              || { echo "FALHA [catalog-template-missing] $t exists on disk but docs/artifact-catalog.md never names it"; f=1; }
          done

          # The closed set of flow events is written THREE times: as the row set of the "| Event | Means |"
          # table in docs/flow-metrics.md, as the row set of its "| Event | Sole owner | Emitted when |"
          # owner table, and as the METRIC_EVENTS tuple in tools/bla-check. The document states the rule
          # that a seventh event moves all of them together "in one commit, or not at all" — and until this
          # predicate existed, nothing checked it. A set that drifts is worse than one place being wrong:
          # the document promises an owner for an event the validator rejects, or the validator accepts an
          # event no owner is declared for, and the first reader to notice is the one whose series is void.
          tbl() { awk -v h="$1" '$0==h{f=1;next} f&&!/^\|/{exit} f&&/^\| `/{
                    gsub(/^\| `/,""); sub(/`.*/,""); print }' docs/flow-metrics.md | sort -u; }
          tbl '| Event | Means |' > /tmp/es-means
          tbl '| Event | Sole owner | Emitted when |' > /tmp/es-owner
          awk '/^METRIC_EVENTS = \(/{f=1;next} f&&/^\)/{exit} f{gsub(/[ ",]/,""); if($0!="") print}' \
            tools/bla-check | sort -u > /tmp/es-code
          # A vacuous pass is the failure mode this guard exists to prevent: if a heading were reworded the
          # awk above would return nothing, and three empty sets compare equal.
          for s in /tmp/es-means /tmp/es-owner /tmp/es-code; do
            [ "$(wc -l < "$s" | tr -d ' ')" -ge 1 ] \
              || { echo "FALHA [metrics-event-set-unparsed] $s came back empty; a heading or the METRIC_EVENTS tuple was reworded and this predicate can no longer read the set it compares"; f=1; }
          done
          cmp -s /tmp/es-means /tmp/es-owner \
            || { echo "FALHA [metrics-event-set] in docs/flow-metrics.md the 'Event | Means' table and the owner table are not the same closed set: $(diff /tmp/es-means /tmp/es-owner | tr '\n' ' ')"; f=1; }
          cmp -s /tmp/es-owner /tmp/es-code \
            || { echo "FALHA [metrics-event-set] the owner table of docs/flow-metrics.md and METRIC_EVENTS in tools/bla-check are not the same closed set: $(diff /tmp/es-owner /tmp/es-code | tr '\n' ' ')"; f=1; }

          # docs/flow-metrics.md forbids this repository from carrying a series of its own: a
          # .bla/metrics.jsonl committed here would be data nobody measured, and fabricated data in the
          # repository that defines the measurement discredits the measurement. .gitignore cannot express
          # this — the path must stay writable for anyone dogfooding the metrics locally, it must only never
          # be committed — so the guard belongs here.
          if [ -e .bla/metrics.jsonl ]; then
            echo "FALHA [no-fabricated-series] .bla/metrics.jsonl exists; this repository ships no flow-metric series of its own, only the fixtures under tools/tests/fixtures/metrics-*/"
            f=1
          fi

          # CHANGELOG.md asserts, in the paragraph that closes the 0.2.0 entry, that this repository carries
          # no manifest and no lockfile "and a CI predicate keeps it that way". This is that predicate. The
          # library is plain Markdown plus a dependency-free `tools/bla-check`; the first manifest would turn
          # copying a directory into installing a package, which every install path in README.md contradicts.
          manifests=$(find . -maxdepth 2 \( -name package.json -o -name pyproject.toml \
            -o -name requirements.txt -o -name '*.lock' -o -name package-lock.json -o -name yarn.lock \) \
            -not -path './.worktrees/*' | sort | tr '\n' ' ')
          if [ -n "$manifests" ]; then
            echo "FALHA [no-manifest] CHANGELOG.md promises this repository carries no manifest and no lockfile, and these exist: $manifests"
            f=1
          fi

          [ "$f" -eq 0 ] || exit 1

      - name: frontmatter
        # The frontmatter block is sliced with awk between the first two `---` lines, so a `name:` in
        # prose further down the file cannot satisfy the check. The key count is compared EXACTLY, not
        # "at least": an extra key is as much a defect as a missing one — `triggers`/`phase` frontmatter
        # is explicitly forbidden, and only an exact comparison catches it being added back.
        run: |
          f=0
          block() { awk 'NR>1 && /^---$/{exit} NR>1{print}' "$1"; }

          for file in skills/*/SKILL.md; do
            keys=$(block "$file" | grep -cE '^[a-zA-Z_-]+:' | tr -d ' ' || true)
            have=$(block "$file" | grep -cE '^(name|description|leadership_principles):' | tr -d ' ' || true)
            { [ "$keys" = 3 ] && [ "$have" = 3 ]; } \
              || { echo "FALHA [skill-frontmatter] $file has $keys key(s), $have of which are name/description/leadership_principles (expected exactly 3/3)"; f=1; }
          done

          for file in agents/*.md; do
            keys=$(block "$file" | grep -cE '^[a-zA-Z_-]+:' | tr -d ' ' || true)
            have=$(block "$file" | grep -cE '^(name|description|role|user-invocable|invoked_by):' | tr -d ' ' || true)
            { [ "$keys" = 5 ] && [ "$have" = 5 ]; } \
              || { echo "FALHA [agent-frontmatter] $file has $keys key(s), $have of which are name/description/role/user-invocable/invoked_by (expected exactly 5/5)"; f=1; }
          done

          # 5 reviewers / 4 advisors / 1 producer. The three numbers also pin the agent count at 10.
          for pair in reviewer:5 advisor:4 producer:1; do
            role=${pair%:*}
            want=${pair#*:}
            got=$(grep -l "^role: $role" agents/*.md | wc -l | tr -d ' ' || true)
            [ "$got" = "$want" ] \
              || { echo "FALHA [agent-role-count] agents/ declares $got role: $role, expected $want"; f=1; }
          done

          [ "$f" -eq 0 ] || exit 1

      - name: label-integrity
        # Renaming any severity or verdict label is forbidden: AGENTS.md maps each alias on disk to a
        # canonical level, and a renamed alias breaks that map silently. The check is PRESENCE-ONLY on
        # purpose — aliases legitimately grow in number as they are referenced more often, and only two
        # counts are invariants worth pinning, both of them fixed deliberately in Wave 1.
        run: |
          f=0

          while IFS='|' read -r file pat; do
            [ -n "$file" ] || continue
            grep -qF -- "$pat" "$file" \
              || { echo "FALHA [label-missing] $file no longer carries the label $pat"; f=1; }
          done <<'LABELS'
          skills/code-review-bar-raising/SKILL.md|[BLOCKING]
          skills/code-review-bar-raising/SKILL.md|[IMPORTANT]
          skills/code-review-bar-raising/SKILL.md|[NIT]
          skills/code-review-bar-raising/SKILL.md|[QUESTION]
          skills/code-review-bar-raising/SKILL.md|[PRAISE]
          skills/design-review/SKILL.md|[BLOCKING]
          skills/design-review/SKILL.md|[NOTE]
          skills/spec-driven-implementation/SKILL.md|[WARNING]
          agents/code-review-bar-raiser.md|[blocker]
          agents/code-review-bar-raiser.md|[concern]
          agents/code-review-bar-raiser.md|[nit]
          agents/code-review-bar-raiser.md|[question]
          .claude/commands/build.md|[FIX REQUIRED]
          .claude/commands/build.md|[MINOR]
          .claude/commands/build.md|[OK]
          .claude/commands/review.md|🚫
          .claude/commands/review.md|⚠️
          .claude/commands/review.md|💡
          agents/security-guardian.md|Critical
          agents/security-guardian.md|High
          agents/security-guardian.md|Medium
          agents/security-guardian.md|Low
          agents/requirements-analyzer.md|🔴
          agents/requirements-analyzer.md|🟡
          agents/implementation-verifier.md|PASS WITH WARNINGS
          skills/operational-readiness-review/templates/orr-checklist.md|APPROVED WITH CONDITIONS
          LABELS

          # The only two exact counts. Do NOT tighten [blocker] or 🔴 to a count: both were measured
          # growing (5 to 9 and 1 to 5) as references, not renames, and presence-only IS the contract.
          while IFS='|' read -r file pat want; do
            [ -n "$file" ] || continue
            got=$(grep -cF -- "$pat" "$file" | tr -d ' ' || true)
            [ "$got" = "$want" ] \
              || { echo "FALHA [blocking-count] $file carries $pat on $got line(s), expected $want"; f=1; }
          done <<'COUNTS'
          skills/code-review-bar-raising/SKILL.md|[BLOCKING]|3
          skills/design-review/SKILL.md|[BLOCKING]|2
          COUNTS

          [ "$f" -eq 0 ] || exit 1

      - name: xref-exists
        # A path cited in prose is a promise. `bla-check links` only sees markdown link targets, so a
        # path named in a sentence, a table cell or a code span escapes it entirely — this is the check
        # that catches those. It is born green only because docs/cursor-setup.md, cited but never
        # written, was corrected in the same commit that added this step.
        #
        # The `\.bla/[a-z0-9-]+\.md` arm is what keeps .bla/implementation-memory.md verified. It used to
        # be matched by the docs/ arm; without its own arm the citations of it would stop being checked
        # silently, which is the worst failure mode a truth predicate has. The docs/ arm stays — this
        # library's own seven documents still need it.
        #
        # Planning state is pruned for the same reason the other two document checks prune it: .agents/
        # and .worktrees/ hold drafts, placeholders (skills/x/SKILL.md, agents/x.md) and paths a plan
        # has not written yet, so a citation there is not a promise the repository made. Without these
        # two flags the step is green in CI — neither directory is checked out there — and red for the
        # first maintainer who pastes it into a local shell as the header of this file invites, which
        # teaches them to ignore a real predicate. The two surfaces that already prune the same pair
        # are tools/bla-check (SKIP_DIRS = .git .agents .worktrees node_modules) and
        # .markdownlint-cli2.jsonc (ignores .agents/** and .worktrees/**).
        #
        # CHANGELOG.md is excluded for the same reason artifact-location excludes it: a changelog names
        # a path as it was at the time of the entry, not as it is now. The 0.4.0 migration table cites
        # the pre-0.4.0 implementation-memory location precisely because it no longer exists, and a
        # citation of a deliberately-removed path is history, not a broken promise.
        run: |
          f=0

          for ref in $(grep -rhoE '(agents/[a-z0-9-]+\.md|skills/[a-z0-9-]+/SKILL\.md|patterns/[a-z0-9-]+/PATTERN\.md|docs/[a-z0-9-]+\.md|\.bla/[a-z0-9-]+\.md|\.claude/commands/[a-z0-9-]+\.md|skills/[a-z0-9-]+/templates/[a-z0-9-]+\.md)' \
                        --include='*.md' --exclude=CHANGELOG.md --exclude-dir=.agents --exclude-dir=.worktrees . | sort -u); do
            [ -e "$ref" ] || { echo "FALHA [xref-missing] $ref is cited in a markdown file but does not exist on disk"; f=1; }
          done

          [ "$f" -eq 0 ] || exit 1

      - name: artifact-location
        # Flow artifacts live under .bla/ and nowhere else. `docs/` is the library's OWN documentation
        # (seven files: artifact-catalog, flow-metrics, getting-started, philosophy, references,
        # skill-anatomy, build-like-amazon.png) and a root-level `specs` directory is the pre-0.4.0
        # location. A re-declaration of either is the drift this predicate exists to catch: before 0.4.0
        # `docs/` did double duty, and the first reader to notice would be an adopter whose artifacts
        # landed in two places.
        #
        # Written as a DENYLIST of the artifact prefixes, never as an allowlist of the library files.
        # An allowlist needs an edit for every document added — and a forgotten edit is a false positive
        # on a legitimate file — while it lets a new artifact directory in by simply adding itself to the
        # list. No library file matches a prefix below, so none can false-positive.
        #
        # CHANGELOG.md is excluded on purpose: the 0.4.0 migration note names every old path, and that is
        # the one file where an old path is the correct content.
        #
        # This file is NOT excluded, because it is exactly where paths get re-pointed and a violation here
        # must be caught. Both patterns are therefore spelled so they cannot match their own source: the
        # parenthesised alternations below, and the one-character bracket class on the old metric
        # filename, change nothing about what is matched on disk, but they put a `(` or a `[` where the
        # searched text would need a letter. Written plainly the step was measured RED on its own two
        # pattern lines. The bracket class is what a parenthesis cannot do: it also defeats the
        # fixed-string release sweep that asserts the pre-0.4.0 metric filename survives nowhere at all.
        #
        # The second arm normalises before testing: rather than a lookbehind (forbidden — no `grep -P`) it
        # deletes every legitimate token from the line with `sed` and asks whether a bare one survives.
        # `.bla/specs/` is the artifact path and `.kiro/specs/` is Kiro's own native feature; what remains
        # after the deletions is a genuine root-relative citation. `|| true` on both greps so the step is
        # safe under `set -e` and `pipefail`, and `-I` skips docs/build-like-amazon.png.
        run: |
          f=0

          docs_hits=$(grep -rnI -E \
            'docs/(working-backwards|design|coe|reviews|operations|deployment)/|docs/(implementation-memory|bla-metric[s])' \
            --exclude-dir=.git --exclude-dir=.agents --exclude-dir=.worktrees \
            --exclude-dir=node_modules --exclude=CHANGELOG.md . || true)
          if [ -n "$docs_hits" ]; then
            echo "$docs_hits" | awk -F: '{ printf "FALHA [artifact-outside-dot-bla] %s:%s a flow artifact is declared under docs/; flow artifacts live under .bla/ (docs/ is the library'"'"'s own documentation)\n", $1, $2 }'
            f=1
          fi

          specs_hits=$(grep -rnI -E '(specs)/' \
            --exclude-dir=.git --exclude-dir=.agents --exclude-dir=.worktrees \
            --exclude-dir=node_modules --exclude=CHANGELOG.md . \
            | sed 's|\.bla/specs/||g; s|\.kiro/specs/||g' \
            | grep -E '(specs)/' || true)
          if [ -n "$specs_hits" ]; then
            echo "$specs_hits" | awk -F: '{ printf "FALHA [artifact-outside-dot-bla] %s:%s a root-relative spec directory is cited; the spec trio lives under .bla/specs/\n", $1, $2 }'
            f=1
          fi

          [ "$f" -eq 0 ] || exit 1

      - name: links
        # Relative markdown links, resolved only against the directory of the file containing them.
        run: |
          if python3 tools/bla-check links .; then
            echo "links: clean"
          else
            echo "FALHA [links] python3 tools/bla-check links . reported broken links (see the FALHA [link-broken] lines above)"
            exit 1
          fi

      - name: self-test
        # The checker checks documents; this checks the checker. A green workflow whose checker silently
        # stopped detecting anything is worse than no workflow at all.
        run: |
          if python3 tools/tests/run.py; then
            echo "self-test: clean"
          else
            echo "FALHA [self-test] python3 tools/tests/run.py reported a failing case (see the FAIL lines above)"
            exit 1
          fi

      - name: markdownlint
        # The version is pinned in the invocation, which is the pin — node is preinstalled, so no action
        # and no third-party supply-chain surface is added for this. The configuration is discovered from
        # .markdownlint-cli2.jsonc at the repository root, so there is no --config flag to drift.
        run: |
          if npx -y markdownlint-cli2@0.18.1 "**/*.md"; then
            echo "markdownlint: clean"
          else
            echo "FALHA [markdownlint] markdownlint-cli2 reported errors (see the lines above)"
            exit 1
          fi

      - name: version-agreement
        # This library is distributed by copying, so the version an adopter can actually read is `VERSION`
        # at the root — `.claude-plugin/plugin.json` is invisible to anyone who copied one harness
        # directory. Two version strings in two files is a drift machine: this step is what makes the
        # duplication safe, by failing the moment they stop agreeing, or the moment CHANGELOG.md stops
        # naming the current one.
        #
        # What this step deliberately does NOT check: that CHANGELOG.md gained an entry in this pull
        # request. A normal pull request does not write the changelog — only a change that affects users
        # does (the rule is stated at the top of CHANGELOG.md and in CONTRIBUTING.md). A predicate
        # demanding an entry per PR would be born red on typo fixes and would be trained away.
        #
        # Version headings in CHANGELOG.md carry no square brackets on purpose: `## [0.2.0]` is a
        # CommonMark shortcut reference link and trips MD052/MD053, both enabled. This step matches the
        # bracket-free form, so re-adding brackets fails here as well as in markdownlint.
        run: |
          f=0
          v=''

          if [ ! -f VERSION ]; then
            echo "FALHA [version-marker-absent] VERSION does not exist at the repository root"
            f=1
          else
            n=$(grep -c . VERSION | tr -d ' ' || true)
            v=$(head -1 VERSION | tr -d ' \t\r')
            { [ "$n" = 1 ] && echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; } \
              || { echo "FALHA [version-marker-absent] VERSION must be a single x.y.z line; found $n non-empty line(s), first is '$v'"; f=1; }
          fi

          p=$(grep -m1 '"version"' .claude-plugin/plugin.json \
              | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || true)
          [ -n "$v" ] && [ "$v" = "$p" ] \
            || { echo "FALHA [version-disagreement] VERSION says '$v' but .claude-plugin/plugin.json says '$p'"; f=1; }

          if [ ! -f CHANGELOG.md ]; then
            echo "FALHA [changelog-head-mismatch] CHANGELOG.md does not exist at the repository root"
            f=1
          else
            h=$(grep -m1 '^## [0-9]' CHANGELOG.md || true)
            case "$h" in
              "## $v"*) : ;;
              *) echo "FALHA [changelog-head-mismatch] the newest version heading in CHANGELOG.md is '$h', which does not name VERSION ($v)"; f=1 ;;
            esac
          fi

          [ "$f" -eq 0 ] || exit 1

      - name: parity
        # THE MAINTENANCE CONTRACT FOR THE HARNESS COMMAND DIRECTORIES.
        #
        # `.claude/commands/` is CANONICAL: it is the file you edit. `.gemini/commands/` and
        # `.kiro/commands/` are MIRRORS — their own first line says so — and a mirror may differ from
        # its canonical source by exactly two declared mechanics and nothing else:
        #   T1  the `<!-- MIRROR: … -->` banner plus the single blank line after it (mirrors only);
        #   T2  the `> **Path resolution**: …` blockquote plus the single blank line after it
        #       (`.claude/` only — it describes the Claude plugin root, a concept the other two
        #       harnesses do not have).
        # A mirror may never contain: an edit of any kind, an absolute path, or a command name that
        # `.claude/commands/` does not hold (a missing command and an extra one are the same defect).
        # To change a command, edit the Claude version and re-apply the two mechanics to both mirrors.
        #
        # WHY THE MIRRORS WERE NOT REPLACED BY THIN SHELLS POINTING AT ONE CANONICAL BODY — measured,
        # so a future maintainer does not redo the analysis. The three documented copy-based installs
        # were simulated with the README's own `cp -r` commands, and the canonical pointer target was
        # then resolved against four candidate bases: it resolves at 0 of 4 under 3 of the 4 documented
        # install paths, because each of those copies ONE harness directory (and Kiro renames it to
        # `.kiro/prompts/`), so the canonical body is simply not on disk. Under those installs a thin
        # shell is not a degraded command but a null instruction, so a shell would have to carry the
        # rule kernel to stay functional — which restores the whole duplication the restructure exists
        # to remove. Revisit the day this library stops distributing by copying one harness directory.
        #
        # OUTSIDE THIS PREDICATE'S UNIT, deliberately. The unit is the 14 commands.
        # `.cursor/rules/amazon-skills.md` is a thin router in the *rules* channel, where a router works
        # (the whole repository is present), and it carries no command body. `.kiro/skills/*.md` are
        # thin routers by their own declaration: measured at 52 and 60 lines, they cite ZERO `commands/`
        # paths and every `skills/` directory they name exists, so they are not a drift surface for the
        # commands and adding them here would assert nothing.
        run: |
          f=0

          # The mirror set is discovered from disk, never from a fixed list, so a fourth harness added
          # tomorrow is covered automatically and a forgotten one cannot leave the set in silence.
          MIRRORS=$(find . -maxdepth 2 -mindepth 2 -type d -name commands \
                    ! -path './.claude/*' ! -path './.agents/*' ! -path './.worktrees/*' \
                    | sed 's|^\./||' | sort)

          # Removes T1 and T2 and nothing else. Newline-agnostic by construction, because awk always
          # terminates its last output line — which is why the missing final newline in 13 of the 14
          # `.claude/commands/` files needs no whitespace churn (MD047 is not enabled).
          norm() { awk '
            /^<!-- MIRROR: This file mirrors \.claude\/commands\/[a-z0-9-]+\.md\. Do not edit directly/ { drop=1; next }
            /^> \*\*Path resolution\*\*:/ { drop=1; next }
            drop==1 { drop=0; if ($0 == "") next }
            { print }' "$1"; }

          canon=$(mktemp)
          ls .claude/commands | sort > "$canon"

          for m in $MIRRORS; do
            mine=$(mktemp)
            ls "$m" | sort > "$mine"
            if ! cmp -s "$canon" "$mine"; then
              echo "FALHA [parity-name-set] $m holds a different command set than .claude/commands/"
              diff "$canon" "$mine" | head -20
              f=1
            fi
            rm -f "$mine"

            for n in $(cat "$canon"); do
              [ -f "$m/$n" ] || continue
              head -1 "$m/$n" | grep -qF "mirrors .claude/commands/$n." \
                || { echo "FALHA [parity-banner] $m/$n does not open with the mirror banner naming .claude/commands/$n"; f=1; }

              a=$(mktemp); b=$(mktemp)
              norm ".claude/commands/$n" > "$a"
              norm "$m/$n" > "$b"
              if ! cmp -s "$a" "$b"; then
                echo "FALHA [parity-body] $m/$n diverges from .claude/commands/$n beyond the banner and the path-resolution note"
                diff "$a" "$b" | head -20
                f=1
              fi
              rm -f "$a" "$b"
            done
          done
          rm -f "$canon"

          # A command file is copied into someone else's project, so a path from this machine in one of
          # them is an instruction that cannot execute anywhere else.
          hits=$(grep -rln '/Users/\|/home/\|/root/' .claude/commands $MIRRORS | wc -l | tr -d ' ' || true)
          [ "$hits" = 0 ] \
            || { echo "FALHA [parity-abs-path] an absolute path appears in $hits command file(s): $(grep -rln '/Users/\|/home/\|/root/' .claude/commands $MIRRORS | tr '\n' ' ')"; f=1; }

          [ "$f" -eq 0 ] || exit 1

      - name: gitleaks
        # No baseline, on purpose: see the comment in .gitleaks.toml. A baseline committed before the
        # first scan converts an unknown into an approved exception.
        #
        # This step has never executed — the workflow itself has not yet run on GitHub Actions — so
        # the two settings below are the ones that keep the first run meaningful. Comments are disabled
        # because the action posts PR comments by default, which needs `pull-requests: write`; the job
        # holds `contents: read` only, and widening the token to buy a comment would trade a real
        # permission for a cosmetic one. A secret still fails the step through the exit code and the
        # log, which is the signal that matters. GITLEAKS_LICENSE is required only for
        # organisation-owned repositories; if the first run fails asking for one, that is the reason,
        # and it is a licence question, not a finding about a secret.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
